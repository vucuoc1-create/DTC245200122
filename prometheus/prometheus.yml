# ==============================================================================
# PROMETHEUS CONFIGURATION
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape Promtail agent metrics
  - job_name: "promtail"
    metrics_path: /metrics
    static_configs:
      - targets: ["promtail:9080"]

  # Scrape Loki metrics
  - job_name: "loki"
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
